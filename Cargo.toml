[workspace]
members = [".", "crates/serial_agent"]

[package]
name = "serial_tool"
version = "1.0.1"
edition = "2021"
build = "build.rs"

[build-dependencies]
embed-resource = "2"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
serialport = { version = "4", default-features = false }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Devices_Communication",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
once_cell = "1"

[profile.dev]
incremental = false
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# retour 0.3.1 的 ABI 宏在 i686 下误生成 extern "win64"(E0570),用本地加了 arch gate 的副本
[patch.crates-io]
retour = { path = "crates/retour" }
